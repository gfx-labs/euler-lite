name: Deploy Dev

on:
  push:
    branches:
      - poppie

env:
  PROJECT_ID: ondo-poppie-prod
  REGION: us-central1
  SERVICE: euler-lite-dev
  IMAGE: us-central1-docker.pkg.dev/ondo-poppie-prod/euler-lite/euler-lite-dev
  WIF_PROVIDER: projects/672110407756/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-deploy@ondo-poppie-prod.iam.gserviceaccount.com

jobs:
  deploy-dev:
    name: Build & Deploy Dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Don't run when semantic-release pushes a tag commit
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Install crane
        run: |
          CRANE_VERSION="0.20.3"
          curl -sL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Build and push image
        run: |
          TAG="dev-$(echo $GITHUB_SHA | head -c 7)"
          mkdir -p /tmp/layer/app
          cp -a .output /tmp/layer/app/.output
          tar -cf /tmp/app-layer.tar -C /tmp/layer app
          crane append \
            --base gcr.io/distroless/nodejs24-debian12:nonroot \
            --new_layer /tmp/app-layer.tar \
            --new_tag ${{ env.IMAGE }}:$TAG
          crane tag ${{ env.IMAGE }}:$TAG latest
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ env.TAG }}
