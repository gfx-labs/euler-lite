name: Deploy Production

# Triggered by version tags on the poppie branch.
# Flow: tag v1.0.0 → npm build → crane image → wait for approval → deploy
on:
  push:
    tags:
      - 'v*'
      - '!v*-rc*'
      - '!v*-beta*'

env:
  PROJECT_ID: ondo-poppie-prod
  REGION: us-central1
  SERVICE: euler-lite
  IMAGE: us-central1-docker.pkg.dev/ondo-poppie-prod/euler-lite/euler-lite
  BASE_IMAGE: gcr.io/distroless/nodejs24-debian12:nonroot
  WIF_PROVIDER: projects/672110407756/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: github-deploy@ondo-poppie-prod.iam.gserviceaccount.com

jobs:
  build:
    name: Build & Push Image
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Extract tag
        id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Build and push image
        run: |
          # Package .output into a tar layer and append onto distroless base
          tar -cf /tmp/app-layer.tar --transform='s,^,.output/,' -C .output .
          crane append \
            --base ${{ env.BASE_IMAGE }} \
            --new_layer /tmp/app-layer.tar \
            --new_tag ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          crane tag ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }} latest

  deploy:
    name: Deploy to Cloud Run
    needs: build
    runs-on: ubuntu-latest
    environment: production  # requires admin approval
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.image_tag }}
