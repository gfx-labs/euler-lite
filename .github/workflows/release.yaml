name: Release

on:
  push:
    branches:
      - poppie

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic Release
        run: npx semantic-release@24
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
